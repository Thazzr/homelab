services:
  # Public entrypoint and TLS termination
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /srv/appdata/npm/data:/data
      - /srv/appdata/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  # Password manager
  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: ${VW_SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
      DOMAIN: ${VW_DOMAIN}
    volumes:
      - /srv/appdata/vaultwarden:/data
    networks:
      - proxy

  # Media server
  emby:
    image: emby/embyserver:4.10.0.26
    container_name: emby
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "993"
    volumes:
      - /srv/appdata/emby:/config
      - /mnt/nas/media:/mnt/media:rw
      - /srv/appdata/emby-dashboard-ui:/system/dashboard-ui:rw
    networks:
      - proxy

  # SMTP relay for Microsoft 365 via Graph OAuth2
  smtp-oauth-relay:
    image: ghcr.io/justiniven/smtp-oauth-relay:1.6.0
    container_name: smtp-oauth-relay
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${SMTP_OAUTH_RELAY_PORT}:8025"
    volumes:
      - /srv/appdata/npm/letsencrypt:/etc/letsencrypt:ro
    environment:
      LOG_LEVEL: ${SMTP_OAUTH_RELAY_LOG_LEVEL}
      SERVER_GREETING: ${SMTP_OAUTH_RELAY_SERVER_GREETING}
      TLS_SOURCE: ${SMTP_OAUTH_RELAY_TLS_SOURCE}
      REQUIRE_TLS: ${SMTP_OAUTH_RELAY_REQUIRE_TLS}
      TLS_CERT_FILEPATH: ${SMTP_OAUTH_RELAY_TLS_CERT_FILEPATH}
      TLS_KEY_FILEPATH: ${SMTP_OAUTH_RELAY_TLS_KEY_FILEPATH}
      USERNAME_DELIMITER: ${SMTP_OAUTH_RELAY_USERNAME_DELIMITER}
    networks:
      proxy:
        aliases:
          - ${SMTP_OAUTH_RELAY_HOSTNAME}

  # Authentik PostgreSQL database
  authentik-postgres:
    image: postgres:16.15-alpine
    container_name: authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes:
      - /srv/appdata/authentik/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U authentik -d authentik
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - proxy

  # Authentik server
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: authentik-server
    restart: unless-stopped
    shm_size: 512mb
    environment:
      TZ: ${TZ}

      AUTHENTIK_HOST: https://auth.inyaro.com
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}

      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}

      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}

    volumes:
      - /srv/appdata/authentik/data:/data
      - /srv/appdata/authentik/media:/media
      - /srv/appdata/authentik/custom-templates:/templates

    depends_on:
      authentik-postgres:
        condition: service_healthy

    command:
      - server

    networks:
      - proxy

  # Authentik worker
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: authentik-worker
    restart: unless-stopped
    shm_size: 512mb
    environment:
      TZ: ${TZ}

      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}

      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}

    volumes:
      - /srv/appdata/authentik/data:/data
      - /srv/appdata/authentik/media:/media
      - /srv/appdata/authentik/certs:/certs
      - /srv/appdata/authentik/custom-templates:/templates

    depends_on:
      authentik-postgres:
        condition: service_healthy

    command:
      - worker

    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy